name: Build Signed Play Store AAB

on:
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Package Web Files into Capacitor Android App
        run: |
          mkdir -p www
          find . -maxdepth 2 -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.svg" -o -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) -exec cp {} www/ \;
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Legacy Pantry Hero" "com.legacywayalliance.pantryhero" --web-dir="www"
          npx cap add android
          npx cap sync android

          cat << 'EOF' >> android/app/build.gradle
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias pantryhero -keyalg RSA -keysize 2048 -validity 10000 -storepass LegacyPantry2026 -keypass LegacyPantry2026 -dname "CN=Legacy Way Alliance, OU=App, O=Legacy Way Alliance, L=Alexandria, S=LA, C=US"

      - name: Build and Sign Android AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore ../release.keystore -storepass LegacyPantry2026 -keypass LegacyPantry2026 app/build/outputs/bundle/release/app-release.aab pantryhero

      - name: Upload Signed AAB and Keystore
        uses: actions/upload-artifact@v4
        with:
          name: play-store-release-files
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            release.keystore
